snapshots:
  - name: dim_products
    relation: ref ('products') # source('my_source', 'my_table') or ref('my_model')
    config:
      database: blinkit_2
      schema: gold
      strategy: timestamp
      unique_key: product_id
      updated_at: products_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')"